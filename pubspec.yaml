name: spomaxxing
description: Pemutar musik Android dengan koleksi, radio suasana, dan audio offline.
publish_to: none
version: 0.2.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.4'

dependencies:
  flutter:
    sdk: flutter
  audio_service: 0.18.18
  audio_session: 0.2.2
  crypto: 3.0.7
  youtube_explode_dart: 3.1.0
  just_audio: 0.10.5
  path: 1.9.1
  path_provider: 2.1.5
  sqflite: 2.4.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.3.6

flutter:
  uses-material-design: true
